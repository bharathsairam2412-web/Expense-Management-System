<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add expense | Ledgerly</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><b class="brand-mark">L</b><span>ledgerly</span></a><div class="eyebrow">Workspace</div><nav class="nav"><a href="dashboard.html"><span class="nav-icon">◒</span><span>Overview</span></a><a href="expenses.html"><span class="nav-icon">≡</span><span>Expenses</span></a><a href="budget.html"><span class="nav-icon">◫</span><span>Budget</span></a></nav><div class="sidebar-foot"><div class="user-chip"><span class="avatar user-initial">A</span><span class="user-name"><b class="user-display">Alex Morgan</b><br><small>Personal workspace</small></span></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">Expenses / New entry</div><h1>Add an expense</h1><p>Capture the detail now. Future-you will appreciate it.</p></div><a class="btn btn-ghost" href="expenses.html">Cancel</a></header><section class="panel form-panel"><form id="expenseForm" class="form-grid"><div class="field full"><label for="title">What was it?</label><input id="title" name="title" placeholder="e.g. Dinner with friends" required></div><div class="field"><label for="amount">Amount</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div><div class="field"><label for="date">Date</label><input id="date" name="date" type="date" required></div><div class="field"><label for="category">Category</label><select id="category" name="category"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Fun</option><option>Other</option></select></div><div class="field"><label for="paymentMethod">Paid with</label><select id="paymentMethod" name="paymentMethod"><option>Card</option><option>Cash</option><option>Transfer</option></select></div><div class="field full"><label for="note">Note <span style="color:var(--muted);font-weight:400">(optional)</span></label><textarea id="note" name="note" placeholder="Add a little context..."></textarea></div><div class="form-actions full"><a class="btn btn-ghost" href="expenses.html">Cancel</a><button class="btn btn-primary" type="submit">Save expense <span>→</span></button></div></form></section></main></div><script src="js/main.js"></script><script src="js/expenses.js"></script></body></html>
