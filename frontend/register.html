<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Ledgerly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-aside"><a class="brand" href="index.html"><b
                    class="brand-mark">L</b><span>ledgerly</span></a>
            <div>
                <h1>Make money feel less noisy.</h1>
                <p>One simple place for expenses, budgets, and the habits behind them.</p>
            </div>
            <div class="auth-quote">Start with today. The rest gets easier.</div>
        </section>
        <section class="auth-form-wrap">
            <form class="auth-form" id="registerForm">
                <div class="eyebrow">A fresh start</div>
                <h2>Create your account</h2>
                <p class="intro">It takes less than a minute.</p>
                <div class="field"><label for="name">Your name</label><input id="name" type="text"
                        placeholder="Alex Morgan" required></div>
                <div class="field"><label for="email">Email address</label><input id="email" type="email"
                        placeholder="alex@example.com" required></div>
                <div class="field"><label for="password">Create password</label><input id="password" type="password"
                        minlength="6" required></div><button class="btn btn-primary" type="submit">Create my ledger
                    <span>→</span></button>
                <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
            </form>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>

</html>
